
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ATEMPORAL — Iniciar sesión</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

  <main class="auth-card">

    <a class="brand" href="login.html">
      ATEMPORAL<span>.</span>
    </a>

    <p class="eyebrow">TU ESPACIO · TU PROGRESO</p>

    <h1>Bienvenido/a</h1>

    <p class="muted">
      Organiza tus días y guarda tu progreso en tu cuenta.
    </p>

    <!-- ACCESO CON CORREO -->
    <form id="email-form" class="stack">

      <label for="email">Correo electrónico</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="tucorreo@ejemplo.com"
        required
      >

      <label for="password">Contraseña</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        minlength="6"
        placeholder="Mínimo 6 caracteres"
        required
      >

      <div class="button-row">

        <button
          class="button primary"
          type="submit"
          id="login-btn"
        >
          Iniciar sesión
        </button>

        <button
          class="button secondary"
          type="button"
          id="signup-btn"
        >
          Crear cuenta
        </button>

      </div>

    </form>

    <!-- GOOGLE -->
    <div class="separator">
      <span>o continúa con</span>
    </div>

    <button
      class="button google"
      id="google-btn"
      type="button"
    >
      Continuar con Google
    </button>

    <!-- TELÉFONO -->
    <section class="phone-box">

      <h2>Ingresar con teléfono</h2>

      <label for="phone">
        Número con código de país
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="+51987654321"
        autocomplete="tel"
      >

      <button
        class="button secondary full"
        id="send-otp-btn"
        type="button"
      >
        Enviar código SMS
      </button>

      <label for="otp">Código recibido</label>

      <input
        id="otp"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="Código de verificación"
      >

      <button
        class="button primary full"
        id="verify-otp-btn"
        type="button"
      >
        Verificar e ingresar
      </button>

    </section>

    <!-- MENSAJES -->
    <p
      id="auth-message"
      class="message"
      role="status"
      aria-live="polite"
    ></p>

    <p class="tiny muted">
      Al crear una cuenta, tus datos se guardan asociados a tu usuario.
    </p>

  </main>

  <script type="module" src="auth.js"></script>

</body>
</html>
